<script>
const $=id=>document.getElementById(id);
const PUBLISHED=JSON.parse($('content').textContent);const clone=o=>JSON.parse(JSON.stringify(o));
const ADMIN_HASH='bc9c149372f2251955f580f33cdf4bef334c0a7c5a6f9d486b108dff8284e699';let admin=false;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let fs={},cur="home";
const KEY='0xb00b4_crimson_fs';
function loadFS(){fs=clone(PUBLISHED);setAdmin(sessionStorage.getItem('adm')==='1')}
function saveFS(){if(admin)try{localStorage.setItem(KEY,JSON.stringify(fs))}catch(e){alert('Storage full — export & use image URLs instead.')}}
function setAdmin(on){admin=on;sessionStorage.setItem('adm',on?1:0);
 try{fs=on?(JSON.parse(localStorage.getItem(KEY))||clone(PUBLISHED)):clone(PUBLISHED)}catch(e){fs=clone(PUBLISHED)}
 $('badge').innerHTML=on?' <span class="badge" style="background:var(--accent);color:#000">ADMIN</span>':'';
 $('mode').innerHTML=on?'<i class="fa-solid fa-lock-open"></i> Admin (local draft)':'<i class="fa-solid fa-lock"></i> Read-only'}
async function doLogin(){if(admin)return showInfo('already logged in');const p=prompt('Passphrase:');if(!p)return;
 if(await sha(p)===ADMIN_HASH){setAdmin(true);navigateTo(cur);showInfo('Access granted. Edits are a local draft — run <b>export</b> to publish.')}else showErr('Access denied.')}
function exportJSON(){const j=JSON.stringify(fs,null,1).replace(/<\//g,'<\\/');navigator.clipboard&&navigator.clipboard.writeText(j).catch(()=>{});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='content.json';a.click();
 showInfo('Exported (also copied). Paste it over the JSON inside <code>&lt;script id="content"&gt;</code>, then upload the file.')}
const safeImg=u=>/^(https?:\/\/\S+|data:image\/\S+|[\w\-\/.]+\.(png|jpe?g|gif|webp|svg))$/i.test(u);
function readImg(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};im.onerror=()=>r(null);im.src=fr.result};fr.readAsDataURL(f)})}
function zoom(s){const l=$('lb');l.querySelector('img').src=s;l.style.display='flex'}

function resolve(c,t){
 if(!t||t==='.'||t==='./')return c;
 if(['~','/','home'].includes(t))return 'home';
 if(t==='about'||t==='writeups')return t;
 const abs=/^(~\/|\/)/.test(t);let st=abs?[]:(c==='home'||c==='about'?[]:c.split('/'));
 for(const p of t.replace(/^(\/|~\/)/,'').split('/')){if(!p||p==='.')continue;p==='..'?st.pop():st.push(p)}
 return st.length?st.join('/'):'home';
}
function getObj(p){
 if(!p||p==='home')return{obj:fs.home,cleanPath:'home'};
 if(p==='about')return{obj:fs.about,cleanPath:'about'};
 const parts=p.split('/').filter(x=>x&&x!=='~');let c=fs;
 for(const x of parts){if(c[x])c=c[x];else if(c.items&&c.items[x])c=c.items[x];else return null}
 return{obj:c,cleanPath:parts.join('/')};
}
function navigateTo(p){
 const r=getObj(p);
 if(!r){showErr(`bash: cd: ${p}: No such file or directory`);return}
 cur=r.cleanPath;history.replaceState(null,'','#'+cur);const{obj,cleanPath}=r;
 $('current-path').innerText='~/'+(cleanPath==='home'?'':cleanPath);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',cleanPath===b.dataset.path||(cleanPath.startsWith('writeups')&&b.dataset.path==='writeups')));
 crumb(cleanPath);const m=$('main-content');
 if(obj.type==='page')m.innerHTML+=obj.content;
 else if(obj.type==='file')fileView(obj);
 else if(obj.type==='dir')dirView(cleanPath,obj);
 stagger();typewrite();
}
function crumb(p){
 const parts=p.split('/');let acc="",h=`<div class="breadcrumb"><i class="fa-solid fa-folder-tree"></i> `;
 parts.forEach((x,i)=>{acc+=(i?'/':'')+x;h+=i===parts.length-1?`<span style="color:var(--text)">${x}</span>`:`<span class="crumb" onclick="navigateTo('${acc}')">${x}</span> / `});
 $('main-content').innerHTML=h+'</div>';
}
function dirView(p,d){
 const parts=p.split('/'),del=k=>admin?`<button class="btn-delete" onclick="deleteItem('${p}','${k}')"><i class="fa-solid fa-trash"></i></button>`:'';
 let h=(admin?'<div class="action-bar"><button class="btn-action" onclick="openCreateModal()"><i class="fa-solid fa-plus"></i> Add Item Here</button></div>':'')+`<h1><i class="fa-solid fa-terminal"></i> <span class="tw">$ ls -la ./${p}</span></h1><ul class="file-list">`;
 if(parts.length>1)h+=`<li><a class="dir-link" onclick="navigateTo('${parts.slice(0,-1).join('/')}')"><i class="fa-solid fa-folder-open" style="color:var(--yellow)"></i> <strong>.. (parent)</strong></a></li>`;
 const ks=d.items?Object.keys(d.items):[];
 if(ks.length)for(const k of ks){const it=d.items[k],ip=p+'/'+k;
  h+=it.type==='dir'
  ?`<li><a class="dir-link" onclick="navigateTo('${ip}')"><i class="fa-solid fa-folder" style="color:var(--accent)"></i> <strong>${k}/</strong> <span style="color:var(--dim);font-size:.8rem">(${esc(it.title||'')})</span></a>${del(k)}</li>`
  :`<li><a class="file-link" onclick="navigateTo('${ip}')"><i class="fa-regular fa-file-code"></i> ${esc(it.title)} <span class="badge">${esc(it.category||'Note')}</span></a>${del(k)}</li>`}
 else h+=`<li style="color:var(--dim)"><i class="fa-solid fa-folder-minus"></i> Directory empty</li>`;
 $('main-content').innerHTML+=h+'</ul>';
}
function fileView(f){
 const im=(f.images||[]).filter(safeImg).map(u=>`<img src="${esc(u)}" alt="writeup image" loading="lazy" onclick="zoom(this.src)">`).join('');
 let h=`<h1><i class="fa-regular fa-file-code"></i> <span class="tw">$ cat ${esc(f.title)}</span></h1><div class="fade">
 <p style="color:var(--dim)"><i class="fa-regular fa-calendar"></i> Date: ${f.date||'N/A'} | <span class="badge">${esc(f.category||'General')}</span></p>
 <hr style="border:0;border-top:1px dashed var(--border);margin:1rem 0">
 <h3><i class="fa-solid fa-magnifying-glass"></i> Overview</h3><p>${esc(f.overview||'No overview provided.')}</p>`;
 if(im)h+=`<h3><i class="fa-regular fa-image"></i> Screenshots</h3><div class="gallery">${im}</div>`;
 if(f.code)h+=`<h3><i class="fa-solid fa-code"></i> Code / Exploit Script</h3><pre><button class="btn-action copy" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> copy</button><code>${hl(f.code)}</code></pre>`;
 $('main-content').innerHTML+=h+'</div>';
}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function hl(c){return esc(c).replace(/(&quot;|"[^"\n]*"|'[^'\n]*')/g,'<span class="st">$1</span>').replace(/\b(from|import|def|return|for|if|else|while|int|char|void|include)\b/g,'<span class="kw">$1</span>')}
function copyCode(b){navigator.clipboard&&navigator.clipboard.writeText(b.parentElement.querySelector('code').innerText);b.innerHTML='<i class="fa-solid fa-check"></i> copied';setTimeout(()=>b.innerHTML='<i class="fa-regular fa-copy"></i> copy',1500)}

/* animations */
function stagger(){document.querySelectorAll('.file-list li').forEach((l,i)=>l.style.animationDelay=i*70+'ms');document.querySelectorAll('.fade>*').forEach((l,i)=>l.style.animationDelay=(500+i*120)+'ms')}
function typewrite(){document.querySelectorAll('.tw').forEach(el=>{const t=el.textContent;el.textContent='';let i=0;const id=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(id)},28)})}
function showErr(m){$('main-content').insertAdjacentHTML('afterbegin',`<div class="terminal-msg"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(m)}</div>`)}
function showInfo(m){$('main-content').insertAdjacentHTML('afterbegin',`<div class="terminal-info"><i class="fa-solid fa-circle-info"></i> ${m}</div>`)}

/* modal */
function openCreateModal(){if(!admin)return;$('create-modal').style.display='flex'}
function closeModal(){$('create-modal').style.display='none'}
function toggleFormFields(){$('file-specific-fields').style.display=$('item-type').value==='file'?'block':'none'}
async function saveNewItem(){
 if(!admin)return;
 const type=$('item-type').value,id=$('item-id').value.trim().toLowerCase().replace(/\s+/g,'-'),title=$('item-title').value.trim();
 if(!id||!title){alert("Please fill in both the ID and Title.");return}
 const r=getObj(cur);if(!r||r.obj.type!=='dir'){showErr("Must be inside a directory to create items.");closeModal();return}
 r.obj.items=r.obj.items||{};
 const imgs=$('item-imgs').value.split('\n').map(s=>s.trim()).filter(safeImg);
 for(const f of $('item-files').files){const d=await readImg(f);if(d)imgs.push(d)}
 r.obj.items[id]=type==='dir'?{type:"dir",title,items:{}}:{type:"file",title:title.endsWith('.md')?title:title+'.md',date:new Date().toISOString().split('T')[0],category:$('item-category').value.trim()||"Writeup",overview:$('item-overview').value.trim(),code:$('item-code').value.trim(),images:imgs};
 $('item-imgs').value='';$('item-files').value='';
 saveFS();closeModal();navigateTo(cur);
}
function deleteItem(d,k){if(!admin)return;if(confirm(`Delete '${k}'?`)){const r=getObj(d);if(r&&r.obj.items&&r.obj.items[k]){delete r.obj.items[k];saveFS();navigateTo(d)}}}
function resetFS(){if(admin&&confirm("Discard draft and reset to the published version?")){fs=clone(PUBLISHED);saveFS();navigateTo('home')}}

/* CLI: history + tab completion */
const cli=$('cli-input'),hist=[];let hi=0;
const CMDS=['help','ls','cd','cat','pwd','whoami','add','reset','clear','neofetch','matrix','date','login','logout','export','hash'];
let rainOn=true;
cli.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)cli.value=hist[--hi]||''}
 else if(e.key==='ArrowDown'){e.preventDefault();hi<hist.length-1?cli.value=hist[++hi]:(hi=hist.length,cli.value='')}
 else if(e.key==='Tab'){e.preventDefault();const p=cli.value.split(/\s+/);
  if(p.length===1){const m=CMDS.filter(c=>c.startsWith(p[0]));if(m.length===1)cli.value=m[0]+' '}
  else{const r=getObj(cur),ks=r&&r.obj.items?Object.keys(r.obj.items):['writeups','about','home'];const m=ks.filter(k=>k.startsWith(p[p.length-1]));if(m.length===1){p[p.length-1]=m[0];cli.value=p.join(' ')}}}
 else if(e.key==='Enter'){
  const line=cli.value.trim();cli.value='';if(!line)return;hist.push(line);hi=hist.length;
  const parts=line.split(/\s+/),cmd=parts[0].toLowerCase(),arg=parts.slice(1).join(' ');
  if(cmd==='help')showInfo("Commands:<br>• <b>ls [path]</b> list • <b>cd [path]</b> change dir • <b>cat [file]</b> read<br>• <b>pwd</b> • <b>whoami</b> • <b>neofetch</b> • <b>matrix</b> toggle rain • <b>date</b><br>• <b>clear</b> • <b>login</b>/<b>logout</b> (owner)<br>Owner only: <b>add</b>, <b>export</b>, <b>reset</b><br>Tab = autocomplete, ↑/↓ = history");
  else if(cmd==='ls')navigateTo(arg?resolve(cur,arg):(cur==='home'||cur==='about'?'writeups':cur));
  else if(cmd==='cd')navigateTo(arg?resolve(cur,arg):'home');
  else if(cmd==='cat'){if(!arg)return showErr("cat: missing file operand");const t=resolve(cur,arg),r=getObj(t);
   r&&(r.obj.type==='file'||r.obj.type==='page')?navigateTo(t):showErr(r?`cat: ${arg}: Is a directory`:`cat: ${arg}: No such file or directory`)}
  else if(cmd==='pwd')showInfo('~/'+cur);
  else if(cmd==='whoami')navigateTo('home');
  else if(cmd==='add')admin?openCreateModal():showErr('permission denied: read-only (owner: login)');
  else if(cmd==='reset')admin?resetFS():showErr('permission denied: read-only');
  else if(cmd==='login')doLogin();else if(cmd==='logout'){setAdmin(false);navigateTo(cur);showInfo('Logged out.')}else if(cmd==='export')admin?exportJSON():showErr('permission denied: read-only');else if(cmd==='hash')sha(arg).then(x=>showInfo('sha256: '+x));else if(cmd==='clear')$('main-content').innerHTML='';
  else if(cmd==='date')showInfo(new Date().toString());
  else if(cmd==='matrix'){rainOn=!rainOn;$('rain').style.display=rainOn?'block':'none';showInfo('rain '+(rainOn?'ON':'OFF'))}
  else if(cmd==='neofetch'){$('main-content').innerHTML=`<div class="nf"><pre>  ▄▄▄▄▄
 █ ☠ ☠ █
 █ ▀▀▀ █
  ▀█▄█▀</pre><div><b style="color:var(--accent)">root@0xb00b4</b><br>─────────────<br><b>OS:</b> Crimson Linux x86_64<br><b>Host:</b> blood-moon<br><b>Shell:</b> bash 5.2<br><b>Location:</b> Tunisia<br><b>Focus:</b> pwn / rev<br><b>Uptime:</b> ${Math.floor(performance.now()/1000)}s</div></div>`}
  else showErr(`bash: ${cmd}: command not found. Type 'help' for options.`);
 }
});
document.addEventListener('click',e=>{if(!e.target.closest('.modal,button,a,input,select,textarea,#boot'))cli.focus()});

/* clock */
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString(),1000);

/* red matrix rain */
const cv=$('rain'),cx=cv.getContext('2d');let cols,drops;
function sizeRain(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16);drops=Array(cols).fill(0).map(()=>Math.random()*-50)}
sizeRain();addEventListener('resize',sizeRain);
setInterval(()=>{if(!rainOn)return;cx.fillStyle='rgba(5,1,2,.12)';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#ff1a40';cx.font='14px monospace';
 drops.forEach((y,i)=>{cx.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*16,y*16);drops[i]=y*16>cv.height&&Math.random()>.975?0:y+1})},60);

 let i=0;const done=()=>{sessionStorage.setItem('booted',1);b.style.opacity=0;setTimeout(()=>b.remove(),600)};
