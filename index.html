/* markdown-lite: headings, lists, bold, code, links, images (img:id resolves to embedded image) */
function hl(c){return esc(c).replace(/("[^"\n]*"|'[^'\n]*')/g,'<span class="st">$1</span>').replace(/\b(from|import|def|return|for|if|else|while|int|char|void|include)\b/g,'<span class="kw">$1</span>')}
const cb=c=>`<pre><button class="btn-action copy" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> copy</button><code>${hl(c)}</code></pre>`;
function md(t,im){im=im||{};
 const inl=s=>esc(s).replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,u)=>{u=u.startsWith('img:')?(im[u.slice(4)]||''):u;return safeImg(u)?`<figure><img src="${u}" alt="${a}" onclick="zoom(this.src)" loading="lazy">${a?`<figcaption>${a}</figcaption>`:''}</figure>`:''})
  .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\b([A-Za-z0-9_]*(?:CTF|flag)\{[^}\s]*\})/gi,'<span class="flag">$1</span>').replace(/\[([^\]]+)\]\((https?:[^)\s"']+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 let o='',code=null,ls=false,m;
 for(const l of String(t||'').split('\n')){
  if(l.startsWith('```')){if(code===null)code=[];else{o+=cb(code.join('\n'));code=null}continue}
  if(code){code.push(l);continue}
  if(ls&&!/^- /.test(l)){o+='</ul>';ls=false}
  if(m=l.match(/^(#{1,3}) (.*)/)){const n=m[1].length+1;o+=`<h${n}>${inl(m[2])}</h${n}>`}
  else if(/^- /.test(l)){if(!ls){o+='<ul>';ls=true}o+=`<li>${inl(l.slice(2))}</li>`}
  else if(/^!\[/.test(l))o+=inl(l);
  else if(l.trim())o+=`<p>${inl(l)}</p>`}
 if(ls)o+='</ul>';if(code)o+=cb(code.join('\n'));return o}
const bodyOf=f=>f.body!==undefined?f.body:(f.overview||'')+(f.code?'\n\n```python\n'+f.code+'\n```':'')+(f.images||[]).filter(safeImg).map(u=>'\n\n![]('+u+')').join('');
function copyCode(b){navigator.clipboard&&navigator.clipboard.writeText(b.parentElement.querySelector('code').innerText);b.innerHTML='<i class="fa-solid fa-check"></i> copied';setTimeout(()=>b.innerHTML='<i class="fa-regular fa-copy"></i> copy',1500)}

/* navigation */
function resolve(c,t){
 if(!t||t==='.'||t==='./')return c;
 if(['~','/'].includes(t))return 'home';
 if(TOP.includes(t))return t;
 const abs=/^(~\/|\/)/.test(t);let st=abs?[]:(c==='home'||c==='about'?[]:c.split('/'));
 for(const p of t.replace(/^(\/|~\/)/,'').split('/')){if(!p||p==='.')continue;p==='..'?st.pop():st.push(p)}
 return st.length?st.join('/'):'home'}
function getObj(p){
 if(!p)p='home';let c=fs;const parts=p.split('/').filter(x=>x&&x!=='~');
 if(!parts.length)parts.push('home');
 for(const x of parts){const n=c===fs?fs[x]:(c.items&&c.items[x]);if(!n||typeof n!=='object')return null;c=n}
 return{obj:c,cleanPath:parts.join('/')}}
const cnt=o=>o.type==='file'||o.type==='card'?1:Object.values(o.items||{}).reduce((a,x)=>a+cnt(x),0);
function navigateTo(p){
 const r=getObj(p);if(!r){showErr(`bash: cd: ${p}: No such file or directory`);return}
 cur=r.cleanPath;history.replaceState(null,'','#'+cur);const{obj,cleanPath}=r;
 $('current-path').innerText='~/'+(cleanPath==='home'?'':cleanPath);
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',cleanPath.split('/')[0]===b.dataset.path));
 crumb(cleanPath);const m=$('main-content');
 if(obj.type==='page')pageView(obj);
 else if(obj.type==='file')fileView(obj);
 else if(obj.type==='card')cardView(obj);
 else dirView(cleanPath,obj);
 if(cleanPath==='home'&&$('recent')){let a=[];walk(fs.writeups,'writeups',(v,p)=>{if(v.type==='file')a.push([v,p])});a.sort((x,y)=>(y[0].date||'').localeCompare(x[0].date||''));
  $('recent').innerHTML=a.slice(0,5).map(([v,p])=>`<li><a class="file-link" onclick="navigateTo('${p}')"><i class="fa-regular fa-file-code"></i> ${esc(v.title)} ${bdg(v.category||'')} <span class="meta">${esc(v.date||'')}</span></a></li>`).join('')||'<li class="meta">no writeups yet</li>'}
 if(cleanPath==='home'&&$('stats'))$('stats').innerHTML=`<div class="stats"><div><b>${cnt(fs.writeups)}</b>writeups</div><div><b>${cnt(fs.projects)}</b>projects</div><div><b>${cnt(fs.achievements)}</b>achievements</div></div>`;
 stagger();typewrite()}
function crumb(p){const parts=p.split('/');let acc="",h=`<div class="breadcrumb"><i class="fa-solid fa-folder-tree"></i> `;
 parts.forEach((x,i)=>{acc+=(i?'/':'')+x;h+=i===parts.length-1?`<span style="color:var(--text)">${esc(x)}</span>`:`<span class="crumb" onclick="navigateTo('${acc}')">${esc(x)}</span> / `});
 $('main-content').innerHTML=h+'</div>'}
const editBtn=p=>admin?`<div class="action-bar"><button class="btn-action" onclick="openEditor('${p}')"><i class="fa-solid fa-pen"></i> edit</button></div>`:'';
function pageView(o){$('main-content').innerHTML+=o.content?o.content:`${editBtn(cur)}<h1><i class="fa-solid fa-user-ninja"></i> <span class="tw">$ cat ${esc(o.title)}</span></h1><div class="md fade">${md(o.body,o.imgs)}</div>`}
function fileView(f){$('main-content').innerHTML+=`${editBtn(cur)}<h1><i class="fa-regular fa-file-code"></i> <span class="tw">$ cat ${esc(f.title)}</span></h1><div class="fade"><p class="meta"><i class="fa-regular fa-calendar"></i> ${esc(f.date||'N/A')} | ${bdg(f.category||'General')}</p><hr style="border:0;border-top:1px dashed var(--border);margin:1rem 0"><div class="md">${md(bodyOf(f),f.imgs)}</div></div>`}
function cardH(it,path,btns){const b=bodyOf(it),m=b.match(/!\[[^\]]*\]\(([^)\s]+)\)/);let cov=m?(m[1].startsWith('img:')?(it.imgs||{})[m[1].slice(4)]:m[1]):'';
 const ex=b.replace(/```[\s\S]*?```/g,'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[#*`]/g,'').replace(/\s+/g,' ').trim();
 return `<div class="card" tabindex="0" onclick="navigateTo('${path}')" onkeydown="if(event.key==='Enter')navigateTo('${path}')">${cov&&safeImg(cov)?`<img class="cov" src="${cov}" alt="">`:''}<div class="cb">${btns}</div><h3>${esc(it.title)}</h3><p class="meta" style="margin:0">${it.category?bdg(it.category):''} ${esc(it.date||'')}</p><p class="ex">${esc(ex.slice(0,150))}${ex.length>150?'…':''}</p><span class="meta"><i class="fa-solid fa-book-open"></i> read more</span></div>`}
const tileH=(f,path,btns)=>`<div class="tile" style="--tc:${ccol(f.category||'')}" tabindex="0" onclick="navigateTo('${path}')" onkeydown="if(event.key==='Enter')navigateTo('${path}')"><div class="cb">${btns}</div><div>${bdg(f.category||'General')}</div><h4>${esc(f.title.replace(/\.md$/,''))}</h4><div class="meta" style="display:flex;justify-content:space-between"><span>${esc(f.date||'')}</span><span class="pts">${esc(f.pts||'')}</span></div></div>`;
function cardView(o){const par=cur.split('/').slice(0,-1).join('/');
 $('main-content').innerHTML+=`<div class="action-bar"><button class="btn-action" onclick="navigateTo('${par}')"><i class="fa-solid fa-arrow-left"></i> back</button>${admin?`<button class="btn-action" onclick="openEditor('${cur}')"><i class="fa-solid fa-pen"></i> edit</button>`:''}${safeUrl(o.link)?`<a class="btn-action" href="${o.link}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> open link</a>`:''}</div><h1><i class="fa-solid fa-folder-open"></i> <span class="tw">${esc(o.title)}</span></h1><div class="fade"><p class="meta">${o.category?bdg(o.category):''} ${esc(o.date||'')}</p><div class="md">${md(bodyOf(o),o.imgs)}</div></div>`}
function dirView(p,d){
 const btns=k=>admin?`<button class="btn-delete" title="edit" onclick="event.stopPropagation();openEditor('${p}/${k}')"><i class="fa-solid fa-pen"></i></button><button class="btn-delete" title="delete" onclick="event.stopPropagation();deleteItem('${p}','${k}')"><i class="fa-solid fa-trash"></i></button>`:'';
 const parts=p.split('/'),it=d.items||{},ks=Object.keys(it),dirs=ks.filter(k=>it[k].type==='dir'),files=ks.filter(k=>it[k].type!=='dir');
 let h=(admin?`<div class="action-bar"><button class="btn-action" onclick="openEditor('${p}',1)"><i class="fa-solid fa-plus"></i> Add here</button></div>`:'')+`<h1><i class="fa-solid fa-terminal"></i> <span class="tw">$ ls -la ./${p}</span></h1>`;
 if(d.type==='cards')h+=`<div class="cards">${ks.map(k=>cardH(it[k],p+'/'+k,btns(k))).join('')||'<p class="meta">Nothing here yet.</p>'}</div>`;
 else{let l='';
  if(parts.length>1)l+=`<li><a class="dir-link" onclick="navigateTo('${parts.slice(0,-1).join('/')}')"><i class="fa-solid fa-folder-open" style="color:var(--yellow)"></i> <strong>.. (parent)</strong></a></li>`;
  l+=dirs.map(k=>`<li><a class="dir-link" onclick="navigateTo('${p}/${k}')"><i class="fa-solid fa-folder"></i> <strong>${esc(k)}/</strong> <span class="meta">(${esc(it[k].title||'')})</span></a>${btns(k)}</li>`).join('');
  if(!ks.length)l+='<li class="meta"><i class="fa-solid fa-folder-minus"></i> Directory empty</li>';
  if(l)h+=`<ul class="file-list">${l}</ul>`;
  if(files.length)h+=`<div class="tiles">${files.map(k=>tileH(it[k],p+'/'+k,btns(k))).join('')}</div>`}
 $('main-content').innerHTML+=h}

/* editor: create + edit folders, writeups, cards, about page */
function openEditor(path,create){if(!admin)return;const r=getObj(path);if(!r)return;let o=r.obj,p=null,k=null,page=false;
 if(create)p=o,o={};else if(o.type==='page')page=true;else{const a=r.cleanPath.split('/');k=a.pop();p=getObj(a.join('/')).obj}
 const isc=p&&p.type==='cards';
 ED={o,p,k,page,create:!!create,imgs:clone(o.imgs||{}),t:page?'page':isc?'card':(k?o.type:'file')};
 $('ed-h').innerHTML=`<i class="fa-solid fa-pen"></i> ${create?'New item':'Edit '+esc(o.title||k)}`;
 $('f-type').value=ED.t==='dir'?'dir':'file';
 $('g-type').style.display=create&&!isc?'block':'none';$('g-id').style.display=create?'block':'none';
 $('f-id').value='';$('f-title').value=o.title||'';$('f-cat').value=o.category||'';$('f-date').value=o.date||new Date().toISOString().split('T')[0];
 $('f-link').value=o.link||o.pts||'';$('f-body').value=page||o.type==='file'||o.type==='card'?bodyOf(o):'';
 $('f-prev').style.display='none';$('f-body').style.display='block';upd();$('ed').style.display='flex'}
function upd(){const t=ED.t;$('g-meta').style.display=t==='file'||t==='card'?'grid':'none';$('g-link').style.display=t==='card'||t==='file'?'block':'none';$('g-link').querySelector('label').textContent=t==='card'?'Link (optional)':'Points / difficulty (optional)';$('f-link').placeholder=t==='card'?'https://':'e.g. 200 pts or easy';$('g-body').style.display=t==='dir'?'none':'block'}
const closeEd=()=>$('ed').style.display='none';
function ins(s){const t=$('f-body'),a=t.selectionStart;t.setRangeText(s,a,t.selectionEnd,'end');t.focus()}
function wrap(a,b){b=b===undefined?a:b;const t=$('f-body'),s=t.selectionStart,e=t.selectionEnd;t.setRangeText(a+t.value.slice(s,e)+b,s,e,'end');t.focus()}
function prev(){const p=$('f-prev'),t=$('f-body'),on=p.style.display==='none';p.innerHTML=on?md(t.value,ED.imgs):'';p.style.display=on?'block':'none';t.style.display=on?'none':'block'}
async function addImgs(files){for(const f of files){const d=await readImg(f);if(!d)continue;const id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);ED.imgs[id]=d;
 ins(`\n![${(f.name||'image').replace(/\.\w+$/,'').replace(/[\[\]()]/g,'')}](img:${id})\n`)}}
$('f-body').addEventListener('paste',e=>{const f=[...e.clipboardData.files].filter(x=>x.type.startsWith('image/'));if(f.length){e.preventDefault();addImgs(f)}});
$('f-body').addEventListener('dragover',e=>e.preventDefault());
$('f-body').addEventListener('drop',e=>{const f=[...e.dataTransfer.files].filter(x=>x.type.startsWith('image/'));if(f.length){e.preventDefault();addImgs(f)}});
function saveItem(){const t=ED.t,body=$('f-body').value,title=$('f-title').value.trim();
 const used=Object.fromEntries(Object.entries(ED.imgs).filter(([i])=>body.includes('img:'+i)));
 if(t==='page'){Object.assign(ED.o,{body,imgs:used,title:title||ED.o.title});saveFS();closeEd();return navigateTo(cur)}
 const id=ED.k||$('f-id').value.trim().toLowerCase().replace(/[^a-z0-9._-]+/g,'-');
 if(!id||!title)return alert('Fill in both the slug and the title.');
 ED.p.items=ED.p.items||{};
 if(ED.create&&ED.p.items[id])return alert('That slug already exists here.');
 const old=ED.create?{}:ED.o;
 ED.p.items[id]=t==='dir'?{type:'dir',title,items:old.items||{}}
  :{...old,overview:undefined,code:undefined,images:undefined,type:t,title:t==='file'&&!/\.md$/.test(title)?title+'.md':title,date:$('f-date').value,category:$('f-cat').value.trim()||(t==='file'?'Writeup':''),link:t==='card'?$('f-link').value.trim():undefined,pts:t==='file'?$('f-link').value.trim():undefined,body,imgs:used};
 saveFS();closeEd();navigateTo(cur)}
function deleteItem(d,k){if(!admin)return;if(confirm(`Delete '${k}'?`)){const r=getObj(d);if(r&&r.obj.items&&r.obj.items[k]){delete r.obj.items[k];saveFS();navigateTo(d)}}}
function resetFS(){if(admin&&confirm("Discard draft and reset to the published version?")){fs=clone(PUBLISHED);saveFS();navigateTo('home')}}
function walk(o,p,f){for(const[k,v]of Object.entries(o.items||{})){f(v,p+'/'+k);walk(v,p+'/'+k,f)}}

/* publish: commit content.json (+ images/) straight to GitHub from the browser */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function gh(c,path,method,body){
 const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${path}`+(method==='GET'?`?ref=${c.branch}&t=${Date.now()}`:''),{method,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
 if(r.status===404&&method==='GET')return null;
 if(!r.ok)throw new Error(r.status===401?'bad token (401) — run: publish reset':r.status===403||r.status===404?'no write access — check the repo name and token permissions (Contents: read & write)':'GitHub error '+r.status);
 return r.json()}
async function publish(arg){
 if(!admin)return showErr('permission denied: read-only (login first)');
 if(arg==='reset'){localStorage.removeItem('gh_cfg');return showInfo('GitHub settings cleared.')}
 let c=null;try{c=JSON.parse(localStorage.getItem('gh_cfg'))}catch(e){}
 if(!c){const repo=prompt('GitHub repo (username/repo):');if(!repo)return;const token=prompt('Fine-grained token (Contents: read & write, this repo only):');if(!token)return;
  c={repo:repo.trim(),token:token.trim(),branch:prompt('Branch:','main')||'main'};localStorage.setItem('gh_cfg',JSON.stringify(c))}
 showInfo("Publishing… keep this tab open.");
 try{const jobs=[],scan=o=>{if(o.imgs)for(const[k,v]of Object.entries(o.imgs))if(String(v).startsWith('data:'))jobs.push([o,k,v]);Object.values(o.items||{}).forEach(scan)};
  Object.values(fs).forEach(scan);
  for(const[o,k,v]of jobs){const path='images/'+(await sha(v)).slice(0,16)+'.jpg';
   if(!await gh(c,path,'GET'))await gh(c,path,'PUT',{message:'add image',content:v.split(',')[1],branch:c.branch});o.imgs[k]=path}
  saveFS();const old=await gh(c,'content.json','GET');
  await gh(c,'content.json','PUT',{message:'update content',content:b64(JSON.stringify(fs,null,1)),branch:c.branch,sha:old&&old.sha});
  PUBLISHED=clone(fs);navigateTo(cur);showInfo(`Published ✔ (${jobs.length} image${jobs.length==1?'':'s'} uploaded). Live in about a minute.`)
 }catch(e){showErr('publish failed: '+e.message)}}

/* animations + messages */
function stagger(){document.querySelectorAll('.file-list li').forEach((l,i)=>l.style.animationDelay=i*60+'ms');document.querySelectorAll('.fade>*').forEach((l,i)=>l.style.animationDelay=(300+i*90)+'ms')}
function typewrite(){document.querySelectorAll('.tw').forEach(el=>{const t=el.textContent;el.textContent='';let i=0;const id=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(id)},22)})}
function showErr(m){$('main-content').insertAdjacentHTML('afterbegin',`<div class="terminal-msg"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(m)}</div>`)}
function showInfo(m){$('main-content').insertAdjacentHTML('afterbegin',`<div class="terminal-info"><i class="fa-solid fa-circle-info"></i> ${m}</div>`)}

/* CLI */
const cli=$('cli-input'),hist=[];let hi=0,rainOn=true;
const CMDS=['help','ls','cd','cat','pwd','whoami','grep','add','edit','reset','clear','neofetch','matrix','date','login','logout','export','import','publish','hash'];
cli.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)cli.value=hist[--hi]||''}
 else if(e.key==='ArrowDown'){e.preventDefault();hi<hist.length-1?cli.value=hist[++hi]:(hi=hist.length,cli.value='')}
 else if(e.key==='Tab'){e.preventDefault();const p=cli.value.split(/\s+/);
  if(p.length===1){const m=CMDS.filter(c=>c.startsWith(p[0]));if(m.length===1)cli.value=m[0]+' '}
  else{const r=getObj(cur),ks=r&&r.obj.items?Object.keys(r.obj.items):TOP;const m=ks.filter(k=>k.startsWith(p[p.length-1]));if(m.length===1){p[p.length-1]=m[0];cli.value=p.join(' ')}}}
 else if(e.key==='Enter'){
  const line=cli.value.trim();cli.value='';if(!line)return;hist.push(line);hi=hist.length;
  const parts=line.split(/\s+/),cmd=parts[0].toLowerCase(),arg=parts.slice(1).join(' ');
  if(cmd==='help')showInfo("<b>ls [path]</b> list • <b>cd [path]</b> change dir • <b>cat [file]</b> read • <b>grep [word]</b> search everything<br><b>pwd</b> • <b>whoami</b> • <b>neofetch</b> • <b>matrix</b> toggle rain • <b>date</b> • <b>clear</b> • <b>login</b>/<b>logout</b><br>Owner only: <b>add</b> (new item here), <b>edit</b> (edit current file/page), <b>publish</b> (push to GitHub), <b>export</b>, <b>import</b>, <b>reset</b> (discard draft)<br>Tab = autocomplete, ↑/↓ = history");
  else if(cmd==='ls')navigateTo(arg?resolve(cur,arg):(cur==='home'||cur==='about'?'writeups':cur));
  else if(cmd==='cd')navigateTo(arg?resolve(cur,arg):'home');
  else if(cmd==='cat'){if(!arg)return showErr("cat: missing file operand");const t=resolve(cur,arg),r=getObj(t);
   r&&r.obj.type!=='dir'&&r.obj.type!=='cards'?navigateTo(t):showErr(r?`cat: ${arg}: Is a directory`:`cat: ${arg}: No such file or directory`)}
  else if(cmd==='grep'){if(!arg)return showErr('grep: missing search term');const q=arg.toLowerCase();let h='';
   ['writeups','projects','achievements'].forEach(t=>walk(fs[t],t,(v,p)=>{if(v.type!=='dir'&&(v.title+' '+(v.category||'')+' '+bodyOf(v)).toLowerCase().includes(q))h+=`<li><a class="file-link" onclick="navigateTo('${p}')"><i class="fa-regular fa-file-code"></i> ${esc(p)}</a></li>`}));
   $('main-content').innerHTML=`<h1><i class="fa-solid fa-magnifying-glass"></i> $ grep ${esc(arg)}</h1><ul class="file-list">${h||'<li class="meta">no matches</li>'}</ul>`;stagger()}
  else if(cmd==='pwd')showInfo('~/'+cur);
  else if(cmd==='whoami')navigateTo('home');
  else if(cmd==='add'){if(!admin)return showErr('permission denied: read-only (owner: login)');const t=getObj(cur).obj.type;t==='dir'||t==='cards'?openEditor(cur,1):showErr('cd into a folder first')}
  else if(cmd==='edit'){if(!admin)return showErr('permission denied: read-only (owner: login)');const t=getObj(cur).obj;t.type==='dir'||t.type==='cards'||cur==='home'?showErr('open a file, card or the about page first'):openEditor(cur)}
  else if(cmd==='publish')publish(arg);
  else if(cmd==='import'){if(!admin)return showErr('permission denied: read-only');const i=document.createElement('input');i.type='file';i.accept='.json';
   i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());if(!j.home)throw 0;fs=j;saveFS();navigateTo('home');showInfo('Imported.')}catch(e){showErr('import failed: not a valid content.json')}};i.click()}
  else if(cmd==='reset')admin?resetFS():showErr('permission denied: read-only');
  else if(cmd==='login')doLogin();
  else if(cmd==='logout'){setAdmin(false);navigateTo(cur);showInfo('Logged out.')}
  else if(cmd==='export')admin?exportJSON():showErr('permission denied: read-only');
  else if(cmd==='hash')sha(arg).then(x=>showInfo('sha256: '+x));
  else if(cmd==='clear')$('main-content').innerHTML='';
  else if(cmd==='date')showInfo(new Date().toString());
  else if(cmd==='matrix'){rainOn=!rainOn;$('rain').style.display=rainOn?'block':'none';showInfo('rain '+(rainOn?'ON':'OFF'))}
  else if(cmd==='neofetch'){$('main-content').innerHTML=`<div class="nf"><pre>  ▄▄▄▄▄
 █ ☠ ☠ █
 █ ▀▀▀ █
  ▀█▄█▀</pre><div><b style="color:var(--accent)">root@0xb00b4</b><br>─────────────<br><b>OS:</b> Blackout Linux x86_64<br><b>Host:</b> blackout<br><b>Location:</b> Tunisia<br><b>Focus:</b> pwn / rev<br><b>Writeups:</b> ${cnt(fs.writeups)}<br><b>Uptime:</b> ${Math.floor(performance.now()/1000)}s</div></div>`}
  else showErr(`bash: ${cmd}: command not found. Type 'help' for options.`);
