<script>
const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o));
const DEFHOME="Cybersecurity student & CTF player based in Tunisia.\nBinary exploitation, reverse engineering and low-level systems.\n\n::btn GitHub | https://github.com/\n::btn CTFtime | https://ctftime.org/\n::btn Discord | https://discord.com/\n\n## skills\n::bar Pwn 85\n::bar Reverse Engineering 75\n::bar Forensics 65\n::bar OSINT 60";
function norm(o){const h=o.home;if(h){if(h.content||h.body===undefined){h.body=DEFHOME;h.title='./0xb00b4_';delete h.content}}
 if(!o.experience)o.experience={type:'cards',kind:'exp',title:'Experience',items:{'example-role':{type:'card',title:'Technical Instructor',category:'Your organisation',period:'Sep 2024 — present',body:'What you did, what you built, what you learned. Log in and hit **edit** to replace this.'}}};
 if(o.projects)o.projects.kind=o.projects.kind||'project';if(o.achievements)o.achievements.kind=o.achievements.kind||'rank';return o}
let PUBLISHED=norm(JSON.parse($('content').textContent));
const ADMIN_HASH='bc9c149372f2251955f580f33cdf4bef334c0a7c5a6f9d486b108dff8284e699',KEY='0xb00b4_crimson_fs2',TOP=['home','about','writeups','projects','achievements','experience'];
let admin=false,fs={},cur='home',ED=null;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const safeImg=u=>/^(https?:\/\/[^\s"'<>]+|data:image\/[^\s"'<>]+|[\w\-\/.]+\.(png|jpe?g|gif|webp|svg))$/i.test(u);
const CC={rev:'#c4b5fd',web:'#38bdf8',crypto:'#fbbf24',forensic:'#34d399',osint:'#f0abfc',misc:'#94a3b8'};
const ccol=c=>{const k=String(c).toLowerCase();return CC[Object.keys(CC).find(x=>k.includes(x))]||ACC};
const bdg=c=>{const col=ccol(c);return `<span class="badge" style="color:${col};border:1px solid ${col}66;background:${col}14">${esc(c)}</span>`};
const safeUrl=u=>/^https?:\/\/[^\s"'<>]+$/i.test(u||'');
function setAdmin(on){admin=on;sessionStorage.setItem('adm',on?1:0);
 try{fs=on?(JSON.parse(localStorage.getItem(KEY))||clone(PUBLISHED)):clone(PUBLISHED)}catch(e){fs=clone(PUBLISHED)}norm(fs);
 $('badge').innerHTML=on?' <span class="badge" style="background:var(--accent);color:var(--onacc)">ADMIN</span> <button class="btn-action" style="padding:.1rem .6rem" onclick="publish()"><i class="fa-solid fa-cloud-arrow-up"></i> publish</button>':'';
 $('mode').innerHTML=on?'<i class="fa-solid fa-lock-open"></i> Admin (local draft)':'<i class="fa-solid fa-lock"></i> Read-only';led()}
function saveFS(){if(admin)try{localStorage.setItem(KEY,JSON.stringify(fs))}catch(e){alert('Storage full — export your draft and use image URLs for big images.')}}
async function doLogin(){if(admin)return showInfo('already logged in');const p=prompt('Passphrase:');if(!p)return;
 if(await sha(p)===ADMIN_HASH){setAdmin(true);navigateTo(cur);showInfo('Access granted. Edits are a local draft — hit <b>publish</b> to go live.')}else showErr('Access denied.')}
function exportJSON(){const j=JSON.stringify(fs,null,1).replace(/<\//g,'<\\/');navigator.clipboard&&navigator.clipboard.writeText(j).catch(()=>{});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='content.json';a.click();
 showInfo('Exported (also copied). Paste it over the JSON inside <code>&lt;script id="content"&gt;</code> and upload the file.')}
function readImg(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};im.onerror=()=>r(null);im.src=fr.result};fr.readAsDataURL(f)})}
const zoom=s=>{const l=$('lb');l.querySelector('img').src=s;l.style.display='flex'};

/* markdown-lite: headings, lists, bold, code, links, images (img:id resolves to embedded image) */
function hl(c){return esc(c).replace(/("[^"\n]*"|'[^'\n]*')/g,'<span class="st">$1</span>').replace(/\b(from|import|def|return|for|if|else|while|int|char|void|include)\b/g,'<span class="kw">$1</span>')}
const cb=c=>`<pre><button class="btn-action copy" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> copy</button><code>${hl(c)}</code></pre>`;
function md(t,im){im=im||{};
 const inl=s=>esc(s).replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,u)=>{u=u.startsWith('img:')?(im[u.slice(4)]||''):u;return safeImg(u)?`<figure><img src="${u}" alt="${a}" onclick="zoom(this.src)" loading="lazy">${a?`<figcaption>${a}</figcaption>`:''}</figure>`:''})
  .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\b([A-Za-z0-9_]*(?:CTF|flag)\{[^}\s]*\})/gi,'<span class="flag">$1</span>').replace(/\[([^\]]+)\]\((https?:[^)\s"']+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 let o='',code=null,ls=false,m;
 for(const l of String(t||'').split('\n')){
  if(l.startsWith('```')){if(code===null)code=[];else{o+=cb(code.join('\n'));code=null}continue}
  if(code){code.push(l);continue}
  if(ls&&!/^- /.test(l)){o+='</ul>';ls=false}
  if(m=l.match(/^::bar (.+) (\d{1,3})$/)){o+=`<div>${esc(m[1])} <span class="meta">${m[2]}%</span><div class="bar"><i style="--w:${Math.min(100,m[2])}%"></i></div></div>`;continue}
  if(m=l.match(/^::btn (.+?) \| (https?:\/\/[^\s"'<>]+)$/)){o+=`<a class="btn-action" style="margin:0 .5rem .5rem 0" href="${m[2]}" target="_blank" rel="noopener">${esc(m[1])} ↗</a>`;continue}
  if(m=l.match(/^(#{1,3}) (.*)/)){const n=m[1].length+1;o+=`<h${n} id="h-${++HC}">${inl(m[2])}</h${n}>`}
  else if(/^- /.test(l)){if(!ls){o+='<ul>';ls=true}o+=`<li>${inl(l.slice(2))}</li>`}
  else if(/^!\[/.test(l))o+=inl(l);
  else if(l.trim())o+=`<p>${inl(l)}</p>`}
 if(ls)o+='</ul>';if(code)o+=cb(code.join('\n'));return o}
const bodyOf=f=>f.body!==undefined?f.body:(f.overview||'')+(f.code?'\n\n```python\n'+f.code+'\n```':'')+(f.images||[]).filter(safeImg).map(u=>'\n\n![]('+u+')').join('');
function copyCode(b){navigator.clipboard&&navigator.clipboard.writeText(b.parentElement.querySelector('code').innerText);b.innerHTML='<i class="fa-solid fa-check"></i> copied';setTimeout(()=>b.innerHTML='<i class="fa-regular fa-copy"></i> copy',1500)}

/* navigation */
function resolve(c,t){
 if(!t||t==='.'||t==='./')return c;
 if(['~','/'].includes(t))return 'home';
 if(TOP.includes(t))return t;
 const abs=/^(~\/|\/)/.test(t);let st=abs?[]:(c==='home'||c==='about'?[]:c.split('/'));
 for(const p of t.replace(/^(\/|~\/)/,'').split('/')){if(!p||p==='.')continue;p==='..'?st.pop():st.push(p)}
 return st.length?st.join('/'):'home'}
function getObj(p){
 if(!p)p='home';let c=fs;const parts=p.split('/').filter(x=>x&&x!=='~');
 if(!parts.length)parts.push('home');
 for(const x of parts){const n=c===fs?fs[x]:(c.items&&c.items[x]);if(!n||typeof n!=='object')return null;c=n}
 return{obj:c,cleanPath:parts.join('/')}}
const cnt=o=>o.type==='file'||o.type==='card'?1:Object.values(o.items||{}).reduce((a,x)=>a+cnt(x),0);

/* ── SMOOTH NAVIGATE ──────────────────────────────────────────────── */
function navigateTo(p) {
  const r = getObj(p);
  if (!r) { showErr(`bash: cd: ${p}: No such file or directory`); return; }
  const main = $('main-content');
  // Fade out quickly
  main.classList.add('page-exit');
  setTimeout(() => {
    // Rebuild content
    cur = r.cleanPath;
    history.replaceState(null, '', '#' + cur);
    const { obj, cleanPath } = r;
    $('current-path').innerText = '~/' + (cleanPath === 'home' ? '' : cleanPath);
    document.querySelectorAll('nav button').forEach(b =>
      b.classList.toggle('active', cleanPath.split('/')[0] === b.dataset.path)
    );
    crumb(cleanPath);
    main.innerHTML = '';
    if (obj.type === 'page') pageView(obj);
    else if (obj.type === 'file') fileView(obj);
    else if (obj.type === 'card') cardView(obj);
    else dirView(cleanPath, obj);

    if (cleanPath === 'home' && $('recent')) {
      let a = [];
      walk(fs.writeups, 'writeups', (v, p) => { if (v.type === 'file') a.push([v, p]); });
      a.sort((x, y) => (y[0].date || '').localeCompare(x[0].date || ''));
      $('recent').innerHTML = a.slice(0, 5).map(([v, p]) =>
        `<li><a class="file-link" onclick="navigateTo('${p}')"><i class="fa-regular fa-file-code"></i> ${esc(v.title)} ${bdg(v.category || '')} <span class="meta">${esc(v.date || '')}</span></a></li>`
      ).join('') || '<li class="meta">no writeups yet</li>';
    }
    if (cleanPath === 'home' && $('stats')) $('stats').innerHTML =
      `<div class="stats"><div><b>${cnt(fs.writeups)}</b>writeups</div><div><b>${cnt(fs.projects)}</b>projects</div><div><b>${cnt(fs.achievements)}</b>achievements</div></div>`;
    stagger();
    typewrite();
    // Fade back in
    main.classList.remove('page-exit');
  }, 120);
}
/* ─────────────────────────────────────────────────────────────────── */

function crumb(p){const parts=p.split('/');let acc="",h=`<div class="breadcrumb"><i class="fa-solid fa-folder-tree"></i> `;
 parts.forEach((x,i)=>{acc+=(i?'/':'')+x;h+=i===parts.length-1?`<span style="color:var(--text)">${esc(x)}</span>`:`<span class="crumb" onclick="navigateTo('${acc}')">${esc(x)}</span> / `});
 $('main-content').innerHTML=h+'</div>'}
const editBtn=p=>admin?`<div class="action-bar"><button class="btn-action" onclick="openEditor('${p}')"><i class="fa-solid fa-pen"></i> edit</button></div>`:'';
function pageView(o){const home=cur==='home';

/* publish: commit content.json (+ images/) straight to GitHub from the browser */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function gh(c,path,method,body){
 const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${path}`+(method==='GET'?`?ref=${c.branch}&t=${Date.now()}`:''),{method,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
 if(r.status===404&&method==='GET')return null;
 if(!r.ok)throw new Error(r.status===401?'bad token (401) — run: publish reset':r.status===403||r.status===404?'no write access — check the repo name and token permissions (Contents: read & write)':'GitHub error '+r.status);
 return r.json()}
async function publish(arg){
 if(!admin)return showErr('permission denied: read-only (login first)');
 if(arg==='reset'){localStorage.removeItem('gh_cfg');return showInfo('GitHub settings cleared.')}
 let c=null;try{c=JSON.parse(localStorage.getItem('gh_cfg'))}catch(e){}
 if(!c){const repo=prompt('GitHub repo (username/repo):');if(!repo)return;const token=prompt('Fine-grained token (Contents: read & write, this repo only):');if(!token)return;
  c={repo:repo.trim(),token:token.trim(),branch:prompt('Branch:','main')||'main'};localStorage.setItem('gh_cfg',JSON.stringify(c))}
 showInfo("Publishing… keep this tab open.");
 try{const jobs=[],scan=o=>{if(o.imgs)for(const[k,v]of Object.entries(o.imgs))if(String(v).startsWith('data:'))jobs.push([o,k,v]);Object.values(o.items||{}).forEach(scan)};
  Object.values(fs).forEach(scan);
  for(const[o,k,v]of jobs){const path='images/'+(await sha(v)).slice(0,16)+'.jpg';
   if(!await gh(c,path,'GET'))await gh(c,path,'PUT',{message:'add image',content:v.split(',')[1],branch:c.branch});o.imgs[k]=path}
  const fj=[],scF=o=>{(o.files||[]).forEach(x=>{if(x.id)fj.push(x)});Object.values(o.items||{}).forEach(scF)};Object.values(fs).forEach(scF);
  for(const x of fj){const bl=await idbGet(x.id);if(!bl)throw new Error('"'+x.name+'" is missing from this browser, attach it again');
   const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(bl)}),path=`files/${x.sha.slice(0,8)}/${x.name}`;
   if(!await gh(c,path,'GET'))await gh(c,path,'PUT',{message:'add challenge file',content:b64,branch:c.branch});x.path=path;idbDel(x.id);delete x.id}
  saveFS();const old=await gh(c,'content.json','GET');
  await gh(c,'content.json','PUT',{message:'update content',content:b64(JSON.stringify(fs,null,1)),branch:c.branch,sha:old&&old.sha});
  PUBLISHED=clone(fs);navigateTo(cur);showInfo(`Published ✔ (${jobs.length} image${jobs.length==1?'':'s'} uploaded). Live in about a minute.`)
 }catch(e){showErr('publish failed: '+e.message)}}

function led(c,ms){const l=$('led');if(!l)return;l.className=c||(admin?'y':'');if(ms)setTimeout(()=>led(),ms)}
/* animations + messages */
function stagger(){document.querySelectorAll('.dir-link,.file-link').forEach(a=>{a.tabIndex=0;a.onkeydown=e=>{if(e.key==='Enter')a.click()}});document.querySelectorAll('.file-list li').forEach((l,i)=>l.style.animationDelay=i*60+'ms');document.querySelectorAll('.fade>*').forEach((l,i)=>l.style.animationDelay=(300+i*90)+'ms')}
function typewrite(){document.querySelectorAll('.tw').forEach(el=>{const t=el.textContent;el.textContent='';let i=0;const id=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(id)},22)})}
function showErr(m){led('r',1500);$('main-content').insertAdjacentHTML('afterbegin',`<div class="terminal-msg"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(m)}</div>`)}
function showInfo(m){$('main-content').insertAdjacentHTML('afterbegin',`<div class="terminal-info"><i class="fa-solid fa-circle-info"></i> ${m}</div>`)}

/* CLI */
const cli=$('cli-input'),hist=[];let hi=0,rainOn=true;
const CMDS=['help','ls','cd','cat','pwd','whoami','grep','add','attach','edit','reset','clear','neofetch','matrix','date','login','logout','export','import','publish','theme','search','hash'];
cli.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)cli.value=hist[--hi]||''}
 else if(e.key==='ArrowDown'){e.preventDefault();hi<hist.length-1?cli.value=hist[++hi]:(hi=hist.length,cli.value='')}
 else if(e.key==='Tab'){e.preventDefault();const p=cli.value.split(/\s+/);

  else{const r=getObj(cur),ks=r&&r.obj.items?Object.keys(r.obj.items):TOP;const m=ks.filter(k=>k.startsWith(p[p.length-1]));if(m.length===1){p[p.length-1]=m[0];cli.value=p.join(' ')}}}
 else if(e.key==='Enter'){
  const line=cli.value.trim();cli.value='';if(!line)return;hist.push(line);hi=hist.length;
  const parts=line.split(/\s+/),cmd=parts[0].toLowerCase(),arg=parts.slice(1).join(' ');
  if(cmd==='help')showInfo("<b>ls [path]</b> list • <b>cd [path]</b> change dir • <b>cat [file]</b> read • <b>grep [word]</b> search everything<br><b>theme [dedsec|detroit|blackout|cyan]</b> • <b>search</b> (or Ctrl K) • <b>pwd</b> • <b>whoami</b> • <b>neofetch</b> • <b>matrix</b> toggle rain • <b>date</b> • <b>clear</b> • <b>login</b>/<b>logout</b><br>Owner only: <b>add</b> (new item here), <b>attach</b> (challenge files), <b>edit</b> (edit current file/page), <b>publish</b> (push to GitHub), <b>export</b>, <b>import</b>, <b>reset</b> (discard draft)<br>Tab = autocomplete, ↑/↓ = history");
  else if(cmd==='ls')navigateTo(arg?resolve(cur,arg):(cur==='home'||cur==='about'?'writeups':cur));
  else if(cmd==='cd')navigateTo(arg?resolve(cur,arg):'home');
  else if(cmd==='cat'){if(!arg)return showErr("cat: missing file operand");const t=resolve(cur,arg),r=getObj(t);
   r&&r.obj.type!=='dir'&&r.obj.type!=='cards'?navigateTo(t):showErr(r?`cat: ${arg}: Is a directory`:`cat: ${arg}: No such file or directory`)}
  else if(cmd==='grep'){if(!arg)return showErr('grep: missing search term');const q=arg.toLowerCase();let h='';
   ['writeups','projects','achievements','experience'].forEach(t=>walk(fs[t],t,(v,p)=>{if(v.type!=='dir'&&(v.title+' '+(v.category||'')+' '+bodyOf(v)).toLowerCase().includes(q))h+=`<li><a class="file-link" onclick="navigateTo('${p}')"><i class="fa-regular fa-file-code"></i> ${esc(p)}</a></li>`}));
   $('main-content').innerHTML=`<h1><i class="fa-solid fa-magnifying-glass"></i> $ grep ${esc(arg)}</h1><ul class="file-list">${h||'<li class="meta">no matches</li>'}</ul>`;stagger()}
  else if(cmd==='pwd')showInfo('~/'+cur);
  else if(cmd==='whoami')navigateTo('home');
  else if(cmd==='add'){if(!admin)return showErr('permission denied: read-only (owner: login)');const t=getObj(cur).obj.type;t==='dir'||t==='cards'?openEditor(cur,1):showErr('cd into a folder first')}
  else if(cmd==='edit'){if(!admin)return showErr('permission denied: read-only (owner: login)');const t=getObj(cur).obj;t.type==='dir'||t.type==='cards'||cur==='home'?showErr('open a file, card or the about page first'):openEditor(cur)}
  else if(cmd==='theme'){if(!arg)nextTheme();else if(THEMES.includes(arg)){setTheme(arg);showInfo('theme: '+arg)}else showErr('themes: '+THEMES.join(', '))}
  else if(cmd==='search')openPal();
  else if(cmd==='publish')publish(arg);
  else if(cmd==='import'){if(!admin)return showErr('permission denied: read-only');const i=document.createElement('input');i.type='file';i.accept='.json';
   i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());if(!j.home)throw 0;fs=j;saveFS();navigateTo('home');showInfo('Imported.')}catch(e){showErr('import failed: not a valid content.json')}};i.click()}
  else if(cmd==='attach'){if(!admin)return showErr('permission denied: read-only');getObj(cur).obj.type==='file'?pickFiles():showErr('open a writeup first')}
  else if(cmd==='reset')admin?resetFS():showErr('permission denied: read-only');
  else if(cmd==='login')doLogin();
  else if(cmd==='logout'){setAdmin(false);navigateTo(cur);showInfo('Logged out.')}
  else if(cmd==='export')admin?exportJSON():showErr('permission denied: read-only');
  else if(cmd==='hash')sha(arg).then(x=>showInfo('sha256: '+x));
  else if(cmd==='clear')$('main-content').innerHTML='';
  else if(cmd==='date')showInfo(new Date().toString());
  else if(cmd==='matrix'){rainOn=!rainOn;$('rain').style.display=rainOn?'':'none';showInfo('rain '+(rainOn?'ON':'OFF'))}
  else if(cmd==='neofetch'){$('main-content').innerHTML=`<div class="nf"><pre>  ▄▄▄▄▄
 █ ☠ ☠ █
 █ ▀▀▀ █
  ▀█▄█▀</pre><div><b style="color:var(--accent)">root@0xb00b4</b><br>─────────────<br><b>OS:</b> Blackout Linux x86_64<br><b>Host:</b> blackout<br><b>Location:</b> Tunisia<br><b>Focus:</b> pwn / rev<br><b>Writeups:</b> ${cnt(fs.writeups)}<br><b>Uptime:</b> ${Math.floor(performance.now()/1000)}s</div></div>`}
  else showErr(`bash: ${cmd}: command not found. Type 'help' for options.`);
 }});

let dn=null,rd=0;addEventListener('mousedown',e=>dn={x:e.clientX,y:e.clientY},true);

 const s=getSelection(),sel=s&&!s.isCollapsed&&String(s).trim(),drag=dn&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)>5;

 e.stopImmediatePropagation();const x=e.target;setTimeout(()=>{const q=getSelection();if(!q||q.isCollapsed||!String(q).trim()){rd=1;x.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}))}},260)},true);

/* red matrix rain */
const cv=$('rain'),cx=cv.getContext('2d');let cols,drops;
function sizeRain(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16);drops=Array(cols).fill(0).map(()=>Math.random()*-50)}
sizeRain();addEventListener('resize',sizeRain);
setInterval(()=>{if(!rainOn)return;cx.fillStyle='rgba(10,10,10,.12)';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle=ACC;cx.font='14px monospace';
 drops.forEach((y,i)=>{cx.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*16,y*16);drops[i]=y*16>cv.height&&Math.random()>.975?0:y+1})},60);

/* custom cursor: dot + lagging ring + code-glyph trail + click ripples (desktop mouse only) */
(()=>{if(!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const B=document.body,mk=(t,i)=>{const e=document.createElement(t);e.id=i;B.appendChild(e);return e},d=mk('div','cd'),r=mk('div','cr'),cv=mk('canvas','trail'),c=cv.getContext('2d');
 const col=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#22d3ee',G='01{}<>/#$ABCDEF';
 let x=-100,y=-100,rx=-100,ry=-100,lx=0,ly=0,P=[],K=[];B.classList.add('cur');
 const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener('resize',fit);
 addEventListener('mousemove',e=>{x=e.clientX;y=e.clientY;B.classList.add('mv');
  if(Math.hypot(x-lx,y-ly)>14){lx=x;ly=y;P.push({x,y,vx:(Math.random()-.5)*.8,vy:Math.random()*.8+.2,l:1,ch:G[Math.random()*G.length|0]})}
  const t=e.target;r.classList.toggle('h',!!t.closest('a,button,.tile,.card,.crumb,figure img,select,[onclick],label'));
  B.classList.toggle('tx',!!t.closest('input,textarea,pre,.md p,.md li,.md h2,.md h3,.md h4,.terminal-info')&&!t.closest('a,button,figure'))});
 addEventListener('mousedown',()=>{r.classList.add('d');K.push({x,y,r:6,l:1})});addEventListener('mouseup',()=>r.classList.remove('d'));
 document.addEventListener('mouseleave',()=>B.classList.remove('mv'));
 (function loop(){rx+=(x-rx)*.18;ry+=(y-ry)*.18;
  d.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;r.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;
  c.clearRect(0,0,cv.width,cv.height);c.font='12px monospace';c.fillStyle=c.strokeStyle=ACC;
  P=P.filter(p=>p.l>0);for(const p of P){p.l-=.03;p.x+=p.vx;p.y+=p.vy;c.globalAlpha=Math.max(p.l,0)*.8;c.fillText(p.ch,p.x,p.y)}
  K=K.filter(k=>k.l>0);for(const k of K){k.l-=.04;k.r+=3;c.globalAlpha=Math.max(k.l,0);c.beginPath();c.arc(k.x,k.y,k.r,0,7);c.stroke()}
  requestAnimationFrame(loop)})()})();
